<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!--
    Favicon: a hard reduction of the prism.

    Three diverging rays turn to mud at 16px, so only the widest survives
    alongside the entry line and the bar. What remains still says one in, more
    out, which is the whole point of the mark.
  -->
  <rect width="48" height="48" rx="11" fill="#1f4e4a" />
  <path d="M7 24 L17 24" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" />
  <path d="M20 12 L20 36" stroke="#e09b4a" stroke-width="4.6" stroke-linecap="round" />
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="3.2">
    <path d="M23 24 L41 15" opacity="0.55" />
    <path d="M23 24 L41 33" opacity="0.55" />
  </g>
</svg>
