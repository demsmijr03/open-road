<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!--
    Sightline, monochrome. Matches the supplied favicon-16/32 and
    apple-touch-icon-180 exactly: both halves deep teal on a transparent ground,
    rather than the amber-over-white the header uses on its dark band. A browser
    that prefers the SVG icon must not show a different mark from one that falls
    back to the PNGs.

    The path data is the same as src/components/Logo.astro and is never edited.
  -->
  <path d="M5.1850 21.3552 L42.4975 19.6592 A19 19 0 0 0 5.1850 21.3552 Z" fill="#1f4e4a" />
  <path d="M5.1850 26.6448 L42.4975 28.3408 A19 19 0 0 1 5.1850 26.6448 Z" fill="#1f4e4a" />
</svg>
