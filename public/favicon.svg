  <g stroke="#e9a116" stroke-linecap="round">
    <line x1="24" y1="29" x2="24" y2="32.5" stroke-width="2.2" />
    <line x1="24" y1="36" x2="24" y2="41" stroke-width="3.2" />
  </g>
  <path d="M24 7 L41 14 L24 21 L7 14 Z" fill="#faf8f5" />
  <line x1="39.6" y1="16" x2="39.6" y2="19.4" stroke="#e9a116" stroke-width="2" stroke-linecap="round" />
